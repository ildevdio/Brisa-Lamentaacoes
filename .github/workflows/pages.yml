# =====================================================================
# Deploy automático do Livro do Jogador para GitHub Pages.
# Ao dar push na main, o conteúdo da pasta Livro_do_Jogador vira o site:
#   https://ildevdio.github.io/Brisa-Lamentaacoes/
# =====================================================================
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar app para a raiz de publicação
        run: |
          mkdir -p _site
          cp -R Livro_do_Jogador/* _site/
          cp game-data.json _site/game-data.json

      # Mesma chave do placeholder deixado em js/community.js (GIST_TOKEN).
      # O token em si nunca fica no repositório; vem do secret GIST_TOKEN.
      - name: Injetar token de gist (secret) no app publicado
        run: |
          sed -i 's/GIST_TOKEN_PLACEHOLDER/${{ secrets.GIST_TOKEN }}/g' _site/js/community.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4